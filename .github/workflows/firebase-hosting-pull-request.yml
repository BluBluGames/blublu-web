# The site is static, so there is no build step - the repo root is what gets served.
name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  deploy_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keeps the checkout token out of .git/config, which the
          # deploy would otherwise be able to publish.
          persist-credentials: false
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLUBLU_WEB }}'
          projectId: blublu-web
